name: tests
on: [push, pull_request]
env:
  # Hermes fork commit the Intelio VPS runs (docs/intelio-vps.md, Pins).
  # Bump with the checklist in docs/intelio-vps.md section 9.
  HERMES_REPO: https://github.com/inteliodev/hermes-agent
  HERMES_PIN: d9ef91e9d5a00c185fabc47d332994ab2280480a
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python scripts/check_publication.py
      - run: shellcheck -s sh -S warning setup.sh setup-workspace.sh alans-way/scripts/mac-watch.sh scripts/chromium-profile.sh scripts/mac-bluebubbles-setup.sh scripts/hermes-compat.sh scripts/intelio-computers.sh scripts/push-approval.sh

  # Real Hermes at the pinned SHA in a throwaway HERMES_HOME: the plugin loads
  # through the real plugin manager and the CLI surface setup.sh calls exists.
  # continue-on-error until it has been green on a few runs.
  hermes-contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Throwaway HERMES_HOME
        run: |
          mkdir -p "$RUNNER_TEMP/hermes-home"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"
      - name: Install Hermes at the pinned fork SHA
        # Same dependency path as the VPS (Hermes' pm.cli; wheel/sdist builds
        # are refused). PM installs its runtime under $HERMES_HOME/installs.
        run: |
          set -eux
          src="$RUNNER_TEMP/hermes-agent"
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin "$HERMES_REPO"
          git -C "$src" fetch -q --depth 1 origin "$HERMES_PIN"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$HERMES_PIN"
          (cd "$src" && python -m pm.cli install --without agent-browser --without cua-driver)
          venv="$(ls -td "$HERMES_HOME"/installs/*/environments/*/venv | head -1)"
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/hermes" --version
      - name: Install the plugin from this checkout
        run: |
          set -eux
          hermes plugins install --enable "file://$GITHUB_WORKSPACE#alans-way" </dev/null
          hermes plugins list
          test -f "$HERMES_HOME/plugins/alans-way/plugin.yaml"
      - name: Load through the real plugin manager
        run: python scripts/hermes_contract.py
      - name: CLI surface used by setup.sh
        run: |
          set -eux
          sh scripts/hermes-compat.sh hermes_install_supports_live_gateway
          for cmd in "plugins install" "plugins enable" "plugins list" \
                     "tools enable" "tools disable" "config get" "config set" \
                     "gateway setup" "gateway restart" "gateway stop" "proactivity"; do
            # shellcheck disable=SC2086
            hermes $cmd --help >/dev/null
          done
          hermes proactivity --help | grep -q -- --session-key
          for action in bind probe resume configure; do
            hermes proactivity --help | grep -q "$action"
          done
          # Reinstall over the existing install takes the same path setup.sh does.
          sh scripts/hermes-compat.sh hermes_plugin_reinstall "file://$GITHUB_WORKSPACE#alans-way" </dev/null
      - name: Injection flag is read from the plugin's own home
        run: |
          set -eux
          sh scripts/hermes-compat.sh hermes_allow_gateway_injection alans-way
          test "$(hermes config get plugins.entries.alans-way.allow_gateway_injection | tail -1)" = true
          python - <<'PY'
          from hermes_cli.plugins import PluginContext, discover_plugins, get_plugin_manager
          discover_plugins()
          manager = get_plugin_manager()
          loaded = manager._plugins.get("alans-way")
          assert loaded is not None, sorted(manager._plugins)
          assert PluginContext(loaded.manifest, manager)._gateway_injection_allowed() is True
          print("ok   _gateway_injection_allowed() is True for alans-way")
          PY
      - name: Intelio computers MCP wiring is discovered by pinned Hermes
        # Config-only wiring (docs/intelio-vps.md section 12): setup's helper
        # writes mcp_servers.intelio_computers + the profile .env token; Hermes'
        # own discover_mcp_tools() must find the fake relay's tools and call one.
        run: |
          set -eux
          hermes profile create intelio </dev/null
          export INTELIO_NODES_MCP_TOKEN_FILE="$RUNNER_TEMP/nodes-mcp.token"
          python -c 'import secrets; print(secrets.token_hex(32))' > "$INTELIO_NODES_MCP_TOKEN_FILE"
          chmod 600 "$INTELIO_NODES_MCP_TOKEN_FILE"
          python scripts/fake_nodes_mcp.py --token-file "$INTELIO_NODES_MCP_TOKEN_FILE" &
          relay=$!
          trap 'kill "$relay"' EXIT
          for _ in $(seq 50); do
            python -c 'import socket; socket.create_connection(("127.0.0.1", 8645), 0.2).close()' 2>/dev/null && break
            sleep 0.2
          done
          sh scripts/intelio-computers.sh apply "$HERMES_HOME" intelio | tee "$RUNNER_TEMP/apply1.txt"
          grep -qx 'changed=1' "$RUNNER_TEMP/apply1.txt"
          sh scripts/intelio-computers.sh apply "$HERMES_HOME" intelio | tee "$RUNNER_TEMP/apply2.txt"
          grep -qx 'changed=0' "$RUNNER_TEMP/apply2.txt"
          sh scripts/intelio-computers.sh verify "$HERMES_HOME" intelio | tee "$RUNNER_TEMP/verify.txt"
          grep -q 'unauthenticated POST (401)' "$RUNNER_TEMP/verify.txt"
          set +x
          if grep -qF "$(cat "$INTELIO_NODES_MCP_TOKEN_FILE")" "$RUNNER_TEMP"/apply1.txt "$RUNNER_TEMP"/apply2.txt "$RUNNER_TEMP"/verify.txt; then
            echo "FAIL token printed"; exit 1
          fi
          set -x
          test "$(stat -c %a "$HERMES_HOME/profiles/intelio/.env")" = 600
          grep -q 'INTELIO_NODES_MCP_TOKEN' "$HERMES_HOME/profiles/intelio/config.yaml"
          test ! -e "$HERMES_HOME/.env" || ! grep -q INTELIO_NODES_MCP_TOKEN "$HERMES_HOME/.env"
          HERMES_HOME="$HERMES_HOME/profiles/intelio" python scripts/hermes_computers_contract.py
      - name: Push approval against pinned Hermes (mode off still asks for pushes)
        run: |
          set -eux
          hermes plugins install --force --enable "file://$GITHUB_WORKSPACE#push-approval" </dev/null
          test -f "$HERMES_HOME/plugins/push-approval/plugin.yaml"
          python scripts/push_approval_contract.py
